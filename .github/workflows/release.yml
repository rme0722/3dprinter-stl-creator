name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.2)'
        required: true

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: stl-generator/frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frontend dependencies
        working-directory: stl-generator/frontend
        run: npm ci

      - name: Build frontend (standalone)
        working-directory: stl-generator/frontend
        run: npm run build

      - name: Create Python venv and install deps
        run: |
          python -m venv venv
          venv\Scripts\pip install -r stl-generator\backend\requirements.txt

      - name: Run build script
        working-directory: stl-generator/backend
        run: cmd /c build.bat

      - name: Create release zip
        run: |
          $version = "${{ github.event.inputs.version || github.ref_name }}"
          Compress-Archive -Path dist\STL-Creator\* -DestinationPath "STL-Creator-$version.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: STL-Creator
          path: STL-Creator-*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: STL-Creator-*.zip
          generate_release_notes: true
